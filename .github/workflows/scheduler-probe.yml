name: Scheduler Diagnostic (no Discord messages)
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record automatic scheduler event
        env:
          EVENT: ${{ github.event_name }}
        run: |
          echo "Trigger: $EVENT"
          date -u
          echo 'Diagnostic only; no webhook or Discord access.'
